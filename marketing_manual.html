const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEYNAME='maruchan_course_key_'+D.s;
async function dec(k){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));}
function show(html){document.open();document.write(html);document.close();}
async function fromPw(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},true,['decrypt']);
}
(async()=>{
  try{const raw=localStorage.getItem(KEYNAME);
    if(raw){show(await dec(await crypto.subtle.importKey('raw',u(raw),'AES-GCM',false,['decrypt'])));return;}}catch(e){}
  document.getElementById('lock').style.display='block';document.getElementById('pw').focus();
  document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();
    try{const k=await fromPw(document.getElementById('pw').value);
      const html=await dec(k);
      const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));
      try{localStorage.setItem(KEYNAME,btoa(String.fromCharCode(...raw)));}catch(e){}
      show(html);
    }catch(_){document.getElementById('err').textContent='パスワードがちがいます';}});
})();
</script></body></html>
